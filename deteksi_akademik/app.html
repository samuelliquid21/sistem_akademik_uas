<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Deteksi Pelanggaran Akademik</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
* { font-family: 'Inter', sans-serif; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
.sidebar-active { background: #1e3a5f; color: white; box-shadow: 0 4px 12px rgba(30,58,95,0.3); }
.fade-in { animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
<script>
tailwind.config = {
    theme: { extend: { colors: { primary: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a5f' } } } }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900"><div id="root"></div>

<script type="text/babel">
// ==========================================
// API CONFIG
// ==========================================
const API_BASE = window.location.origin + '/api';

const api = {
    post: async (endpoint, data) => {
        const r = await fetch(`${API_BASE}/${endpoint}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return r.json();
    },
    get: async (endpoint) => {
        const r = await fetch(`${API_BASE}/${endpoint}`);
        return r.json();
    }
};

// ==========================================
// ICON COMPONENT
// ==========================================
const Icon = ({ icon, className = "", size = "1.2em" }) => (
    <iconify-icon icon={`solar:${icon}`} class={className} style={{fontSize: size}}></iconify-icon>
);

// ==========================================
// UI COMPONENTS
// ==========================================
const Card = ({ children, className = "", title, action, color = "white" }) => (
    <div className={`bg-${color} border border-slate-200 rounded-xl shadow-sm overflow-hidden ${className}`}>
        {(title || action) && (
            <div className="px-5 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                {title && <h3 className="font-semibold text-slate-800 tracking-tight">{title}</h3>}
                {action && <div>{action}</div>}
            </div>
        )}
        <div className="p-5">{children}</div>
    </div>
);

const Badge = ({ children, color = 'slate' }) => {
    const colors = {
        blue: 'bg-blue-50 text-blue-700 border-blue-100',
        green: 'bg-emerald-50 text-emerald-700 border-emerald-100',
        amber: 'bg-amber-50 text-amber-700 border-amber-100',
        red: 'bg-red-50 text-red-700 border-red-100',
        slate: 'bg-slate-100 text-slate-700 border-slate-200'
    };
    return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${colors[color]||colors.slate}`}>{children}</span>;
};
    
const Modal = ({ isOpen, onClose, title, children }) => {
    if (!isOpen) return null;
    return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm fade-in" onClick={(e) => e.target === e.currentTarget && onClose()}>
            <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden">
                <div className="flex justify-between items-center p-5 border-b border-slate-100">
                    <h3 className="font-semibold text-lg text-slate-900 tracking-tight">{title}</h3>
                    <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icon icon="close-circle-linear" size="1.5em"/></button>
                </div>
                <div className="p-6">{children}</div>
            </div>
        </div>
    );
};

const Toast = ({ message, type = 'success', onClose }) => {
    React.useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
    const colors = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-blue-500' };
    return (
        <div className={`fixed bottom-4 right-4 z-50 flex items-center gap-3 px-4 py-3 text-white rounded-lg shadow-lg fade-in ${colors[type]}`}>
            <Icon icon={type === 'success' ? 'check-circle-linear' : 'danger-circle-linear'} />
            <span className="text-sm font-medium">{message}</span>
        </div>
    );
};

// ==========================================
// HELPER FUNCTIONS
// ==========================================
const badgeBgColor = (r) => {
    if (r.pelanggaran_berat) return 'bg-red-500';
    if (r.peringatan_akademik) return 'bg-amber-500';
    return 'bg-green-500';
};
const kodeColor = (kode) => {
    if (kode === 'P') return '#2563eb';
    if (kode === 'S') return '#059669';
    return '#dc2626';
};
const resultBgColor = (result) => {
    if (result.pelanggaran_berat) return 'bg-red-50 text-red-700 border border-red-200';
    if (result.peringatan_akademik) return 'bg-amber-50 text-amber-700 border border-amber-200';
    return 'bg-green-50 text-green-700 border border-green-200';
};
const testStatusColor = (t) => {
    if (t.pelanggaran_berat && t.peringatan_akademik) return 'bg-red-100 text-red-700 border-red-200';
    if (t.pelanggaran_berat) return 'bg-red-50 text-red-600 border-red-100';
    if (t.peringatan_akademik) return 'bg-amber-50 text-amber-600 border-amber-100';
    return 'bg-green-50 text-green-600 border-green-100';
};

// ==========================================
// LOGIN PAGE
// ==========================================
const Login = ({ onLogin }) => {
    const [username, setUsername] = React.useState('');
    const [password, setPassword] = React.useState('');
    const [loading, setLoading] = React.useState(false);
    const [error, setError] = React.useState('');

    const handleSubmit = async (e) => {
        e.preventDefault(); setLoading(true); setError('');
        try {
            const res = await api.post('login.php', { username, password });
            if (res.success) onLogin(res.user);
            else setError(res.error || 'Login gagal');
        } catch (err) { setError('Koneksi ke server gagal'); }
        setLoading(false);
    };

    return (
        <div className="min-h-screen flex items-center justify-center bg-slate-50 relative overflow-hidden">
            <div className="absolute top-0 left-0 w-full h-96 bg-gradient-to-br from-primary-900 to-blue-600 skew-y-3 origin-top-left -translate-y-32"></div>
            <div className="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-200 relative z-10 p-8 fade-in">
                <div className="text-center mb-8">
                    <div className="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-red-50 text-red-600 mb-4">
                        <Icon icon="shield-warning-linear" size="1.8em"/>
                    </div>
                    <h1 className="text-2xl font-bold tracking-tight text-primary-900">Deteksi Pelanggaran Akademik</h1>
                    <p className="text-sm text-slate-500 mt-2">Sistem berbasis Logika Proposisional & Forward Chaining</p>
                </div>
                <form onSubmit={handleSubmit} className="space-y-4">
                    <div>
                        <label className="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">Username</label>
                        <input type="text" value={username} onChange={e=>setUsername(e.target.value)} placeholder="Masukkan username" required
                            className="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all"/>
                    </div>
                    <div>
                        <label className="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">Password</label>
                        <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required
                            className="w-full px-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-500 transition-all"/>
                    </div>
                    {error && <div className="p-3 rounded-xl bg-red-50 text-red-600 text-sm flex items-center gap-2 border border-red-100"><Icon icon="danger-circle-linear"/>{error}</div>}
                    <button type="submit" disabled={loading}
                        className="w-full py-2.5 bg-primary-900 text-white rounded-xl font-medium hover:bg-primary-800 transition-all shadow-sm hover:shadow-md disabled:opacity-50 flex items-center justify-center gap-2">
                        {loading ? <Icon icon="spinner-linear" className="animate-spin"/> : null}
                        {loading ? 'Memproses...' : 'Masuk'}
                    </button>
                </form>
                <div className="mt-6 text-center text-xs text-slate-400 bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p className="font-semibold mb-1 text-slate-500">Akun Demo:</p>
                    <p>Admin: <span className="font-mono text-blue-600">admin</span> / <span className="font-mono text-blue-600">admin123</span></p>
                    <p>Mahasiswa: <span className="font-mono text-blue-600">mahasiswa1</span> / <span className="font-mono text-blue-600">admin123</span></p>
                </div>
            </div>
        </div>
    );
};

// ==========================================
// LAYOUT
// ==========================================
const Layout = ({ user, children, view, setView, onLogout }) => {
    const menus = {
        admin: [
            { id: 'dashboard', label: 'Dashboard', icon: 'widget-2-linear' },
            { id: 'rules', label: 'Manajemen Rule', icon: 'notebook-linear' },
            { id: 'truth', label: 'Tabel Kebenaran', icon: 'table-linear' },
            { id: 'input', label: 'Input & Deteksi', icon: 'pen-new-square-linear' },
            { id: 'test', label: 'Uji Coba (24 Kasus)', icon: 'clipboard-check-linear' },
            { id: 'riwayat', label: 'Riwayat Deteksi', icon: 'clock-circle-linear' },
            { id: 'admin_mhs', label: 'Kelola Mahasiswa', icon: 'users-group-rounded-linear' },
        ],
        mahasiswa: [
            { id: 'dashboard', label: 'Dashboard', icon: 'widget-2-linear' },
            { id: 'rules', label: 'Manajemen Rule', icon: 'notebook-linear' },
            { id: 'truth', label: 'Tabel Kebenaran', icon: 'table-linear' },
            { id: 'input', label: 'Input & Deteksi', icon: 'pen-new-square-linear' },
            { id: 'test', label: 'Uji Coba (24 Kasus)', icon: 'clipboard-check-linear' },
            { id: 'riwayat', label: 'Riwayat Deteksi', icon: 'clock-circle-linear' },
        ]
    };
    const items = menus[user.role] || menus.mahasiswa;
    const [sidebarOpen, setSidebarOpen] = React.useState(false);

    return (
        <div className="min-h-screen flex bg-slate-50">
            <aside className={`fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 transform transition-transform duration-300 lg:translate-x-0 ${sidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                <div className="h-16 flex items-center px-5 border-b border-slate-100">
                    <div className="w-8 h-8 rounded-lg bg-primary-900 flex items-center justify-center text-white mr-3 font-bold text-xs">PA</div>
                    <span className="font-bold text-slate-900 tracking-tight text-sm">Pelanggaran Akademik</span>
                </div>
                <nav className="p-4 space-y-1">
                    <p className="px-3 text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Menu</p>
                    {items.map(item => (
                        <button key={item.id} onClick={() => { setView(item.id); setSidebarOpen(false); }}
                            className={`w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg transition-all mb-1 ${view === item.id ? 'sidebar-active' : 'text-slate-500 hover:bg-slate-100 hover:text-slate-900'}`}>
                            <Icon icon={item.icon} /> {item.label}
                        </button>
                    ))}
                </nav>
                <div className="absolute bottom-0 w-full p-4 border-t border-slate-100 bg-slate-50/50">
                    <div className="flex items-center gap-3 mb-3 px-2">
                        <div className="w-9 h-9 rounded-full bg-primary-900 flex items-center justify-center text-white text-sm font-bold">{user.nama.charAt(0).toUpperCase()}</div>
                        <div className="flex-1 min-w-0">
                            <p className="text-sm font-medium text-slate-900 truncate">{user.nama}</p>
                            <p className="text-xs text-slate-500 capitalize">{user.role}</p>
                        </div>
                    </div>
                    <button onClick={onLogout} className="w-full flex items-center gap-2 px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg transition-all">
                        <Icon icon="logout-2-linear" /> Keluar
                    </button>
                </div>
            </aside>
            <main className="flex-1 lg:ml-64 flex flex-col min-h-screen">
                <header className="h-16 bg-white/80 backdrop-blur border-b border-slate-200 sticky top-0 z-30 px-4 sm:px-8 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                        <button onClick={()=>setSidebarOpen(true)} className="lg:hidden p-2 text-slate-600"><Icon icon="hamburger-menu-linear"/></button>
                        <h2 className="text-lg font-semibold text-slate-800 tracking-tight">{(items.find(m=>m.id===view)||{}).label||'Dashboard'}</h2>
                    </div>
                    <div className="flex items-center gap-3 text-sm text-slate-500">
                        <Icon icon="calendar-linear"/>{new Date().toLocaleDateString('id-ID', {day:'numeric',month:'long',year:'numeric'})}
                    </div>
                </header>
                <div className="p-4 sm:p-8 flex-1 overflow-auto">{children}</div>
            </main>
            {sidebarOpen && <div onClick={()=>setSidebarOpen(false)} className="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-30 lg:hidden"></div>}
        </div>
    );
};

// ==========================================
// DASHBOARD PAGE
// ==========================================
const Dashboard = ({ user }) => {
    const [stats, setStats] = React.useState(null);
    const [recent, setRecent] = React.useState([]);
    React.useEffect(() => { load(); }, []);
    const load = async () => {
        const data = await api.get('dashboard.php');
        if (data.stats) setStats(data.stats);
        if (data.recent) setRecent(data.recent);
    };
    return (
        <div className="space-y-6 fade-in">
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                {[
                    { label: 'Total Mahasiswa', val: (stats||{}).total_mahasiswa||0, icon: 'users-group-rounded-linear', color: 'text-blue-600', bg: 'bg-blue-50' },
                    { label: 'Total Deteksi', val: (stats||{}).total_deteksi||0, icon: 'clipboard-check-linear', color: 'text-purple-600', bg: 'bg-purple-50' },
                    { label: 'Pelanggaran Berat', val: (stats||{}).total_berat||0, icon: 'shield-warning-linear', color: 'text-red-600', bg: 'bg-red-50' },
                    { label: 'Status Aman', val: (stats||{}).total_aman||0, icon: 'shield-check-linear', color: 'text-green-600', bg: 'bg-green-50' }
                ].map((s,i) => (
                    <Card key={i} className="flex items-center p-4">
                        <div className={`w-12 h-12 rounded-xl ${s.bg} ${s.color} flex items-center justify-center mr-4`}><Icon icon={s.icon} size="1.5em"/></div>
                        <div><p className="text-slate-500 text-xs font-medium uppercase tracking-wide">{s.label}</p><h4 className="text-2xl font-bold text-slate-800">{s.val}</h4></div>
                    </Card>
                ))}
            </div>
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <Card title="Sistem Deteksi Pelanggaran Akademik">
                    <div className="space-y-4 text-sm text-slate-600 leading-relaxed">
                        <p><strong>Sistem menggunakan Logika Proposisional</strong> untuk mendeteksi pelanggaran akademik berdasarkan 4 variabel:</p>
                        <div className="bg-slate-50 rounded-xl p-4 space-y-2 font-mono text-sm">
                            {[{k:'P',v:'Kehadiran < 75%',c:'bg-blue-100 text-blue-700'},{k:'Q',v:'Plagiarisme',c:'bg-red-100 text-red-700'},{k:'R',v:'Menyontek',c:'bg-red-100 text-red-700'},{k:'S',v:'Tugas Tepat Waktu',c:'bg-green-100 text-green-700'}].map(d=>(
                                <div key={d.k} className="flex items-center gap-3">
                                    <span className={`w-8 h-8 rounded-lg ${d.c} flex items-center justify-center font-bold text-sm`}>{d.k}</span> {d.v}
                                </div>
                            ))}
                        </div>
                        <p><strong>Metode Inferensi:</strong> Forward Chaining — mengevaluasi setiap aturan secara berurutan dan menghasilkan keputusan berdasarkan fakta.</p>
                    </div>
                </Card>
                <Card title="Aktivitas Terbaru">
                    {recent.length === 0 ? (
                        <div className="text-center py-8 text-slate-400"><Icon icon="clock-circle-linear" size="3em" className="mb-3 text-slate-300 block mx-auto"/><p>Belum ada aktivitas</p></div>
                    ) : (
                        <div className="space-y-3">
                            {recent.slice(0,8).map(r => (
                                <div key={r.id} className="flex items-start gap-3 pb-3 border-b border-slate-50 last:border-0">
                                    <div className={`w-8 h-8 rounded-full flex items-center justify-center text-white text-xs font-bold ${badgeBgColor(r)}`}>
                                        {((r.nama_mahasiswa||'')).charAt(0).toUpperCase()||'?'}
                                    </div>
                                    <div className="flex-1 min-w-0"><p className="text-sm font-medium text-slate-900 truncate">{r.nama_mahasiswa}</p><p className="text-xs text-slate-500">{r.status_label}</p></div>
                                    <span className="text-xs text-slate-400 flex-shrink-0">{(r.created_at||'').substring(0,10)}</span>
                                </div>
                            ))}
                        </div>
                    )}
                </Card>
            </div>
        </div>
    );
};

// ==========================================
// RULES PAGE
// ==========================================
const Rules = () => {
    const [data, setData] = React.useState(null);
    React.useEffect(() => { api.get('rules.php').then(setData); }, []);
    if (!data) return <div className="text-center py-20 text-slate-400"><Icon icon="spinner-linear" className="animate-spin inline-block" size="2em"/></div>;
    return (
        <div className="space-y-6 fade-in">
            <Card title="Variabel Proposisi">
                <table className="w-full text-sm">
                    <thead><tr className="bg-slate-50 text-slate-500 font-medium"><th className="px-4 py-3 text-left">Kode</th><th className="px-4 py-3 text-left">Proposisi</th><th className="px-4 py-3 text-left">Deskripsi</th></tr></thead>
                    <tbody className="divide-y divide-slate-100">
                        {(data.gejala||[]).map(g => (
                            <tr key={g.id} className="hover:bg-slate-50/80">
                                <td className="px-4 py-3 font-bold" style={{color: kodeColor(g.kode)}}>{g.kode}</td>
                                <td className="px-4 py-3">{g.proposisi}</td>
                                <td className="px-4 py-3 text-slate-500">{g.deskripsi}</td>
                            </tr>
                        ))}
                    </tbody>
                </table>
            </Card>
            <Card title="Knowledge Base — Aturan Logika">
                <div className="space-y-4">
                    {(data.rules||[]).map(r => {
                        const colors = ['bg-blue-50 text-blue-600','bg-blue-50 text-blue-600','bg-amber-50 text-amber-600','bg-green-50 text-green-600'];
                        const badges = ['bg-blue-50 text-blue-700 border-blue-100','bg-blue-50 text-blue-700 border-blue-100','bg-amber-50 text-amber-700 border-amber-100','bg-green-50 text-green-700 border-green-100'];
                        return (
                            <div key={r.id} className="border border-slate-200 rounded-xl p-4 hover:shadow-sm transition-all">
                                <div className="flex items-start gap-4">
                                    <div className={`w-10 h-10 rounded-lg ${colors[r.id-1]||'bg-blue-50 text-blue-600'} flex items-center justify-center font-bold text-sm flex-shrink-0`}>R{r.id}</div>
                                    <div className="flex-1">
                                        <div className="flex items-center gap-2 mb-1"><h4 className="font-semibold text-slate-900">{r.nama_rule}</h4><span className={`px-2 py-0.5 text-xs font-medium border rounded-full ${badges[r.id-1]||'bg-blue-50 text-blue-700 border-blue-100'}`}>{r.ekspresi}</span></div>
                                        <p className="text-sm text-slate-500">{r.deskripsi}</p>
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            </Card>
        </div>
    );
};

// ==========================================
// TRUTH TABLE PAGE
// ==========================================
const TruthTable = () => (
    <div className="space-y-6 fade-in">
        <Card title="Tabel Kebenaran — Setiap Rule">
            <div className="space-y-8">
                {[{
                    title: 'Rule 1: Q → Pelanggaran Berat',
                    headers: ['Q','Pelanggaran Berat'],
                    rows: [['TRUE','bg-green-600'],['FALSE','bg-red-600']],
                    values: [['TRUE','TRUE'],['FALSE','FALSE']]
                },{
                    title: 'Rule 2: R → Pelanggaran Berat',
                    headers: ['R','Pelanggaran Berat'],
                    rows: [['TRUE','bg-green-600'],['FALSE','bg-red-600']],
                    values: [['TRUE','TRUE'],['FALSE','FALSE']]
                },{
                    title: 'Rule 3: (P ∧ ¬S) → Peringatan Akademik',
                    headers: ['P','S','¬S','P∧¬S','Peringatan'],
                    rows: [['T','T','F','F','F'],['T','F','T','T','T'],['F','T','F','F','F'],['F','F','T','F','F']]
                },{
                    title: 'Rule 4: ¬Q ∧ ¬R ∧ ¬(P∧¬S) → Status Aman',
                    headers: ['Q','R','P∧¬S','Status Aman'],
                    rows: [['F','F','F','T'],['F','F','T','F'],['F','T','F','F'],['F','T','T','F'],['T','F','F','F'],['T','F','T','F'],['T','T','F','F'],['T','T','T','F']]
                }].map((t,i) => (
                    <div key={i}>
                        <h4 className="font-semibold text-slate-900 mb-3">{t.title}</h4>
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm border border-slate-200 rounded-xl overflow-hidden">
                                <thead><tr className="bg-slate-50 text-slate-500 font-medium">{t.headers.map((h,j)=><th key={j} className="px-4 py-3 border-r last:border-r-0">{h}</th>)}</tr></thead>
                                <tbody className="divide-y divide-slate-100 text-center">
                                    {t.rows.map((row,j)=>(
                                        <tr key={j} className="hover:bg-slate-50/80">{row.map((v,k)=><td key={k} className={`px-4 py-3 border-r last:border-r-0 font-bold ${v==='T'?'text-green-600':'text-red-600'}`}>{v}</td>)}</tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                ))}
            </div>
        </Card>
    </div>
);

// ==========================================
// INPUT & DETEKSI PAGE
// ==========================================
const InputDeteksi = ({ user }) => {
    const [form, setForm] = React.useState({ nama: '', nim: '', P: 0, Q: 0, R: 0, S: 0 });
    const [result, setResult] = React.useState(null);
    const [loading, setLoading] = React.useState(false);
    const [error, setError] = React.useState('');

    const handleSubmit = async (e) => {
        e.preventDefault(); setLoading(true); setError('');
        try {
            const res = await api.post('deteksi.php', { ...form, user_id: user.id });
            if (res.error) setError(res.error);
            else setResult(res);
        } catch (err) { setError('Gagal memproses deteksi'); }
        setLoading(false);
    };

    const statusBadge = () => {
        if (!result) return null;
        if (result.pelanggaran_berat && result.peringatan_akademik) return ['bg-red-100 text-red-800 border-red-200', 'shield-warning-linear'];
        if (result.pelanggaran_berat) return ['bg-red-100 text-red-800 border-red-200', 'shield-warning-linear'];
        if (result.peringatan_akademik) return ['bg-amber-100 text-amber-800 border-amber-200', 'bell-linear'];
        return ['bg-green-100 text-green-800 border-green-200', 'shield-check-linear'];
    };

    const sel = (name, val) => (
        <select value={val} onChange={e=>setForm({...form,[name]:parseInt(e.target.value)})}
            className="px-3 py-1.5 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-100">
            <option value={0}>0 (Tidak)</option><option value={1}>1 (Ya)</option>
        </select>
    );

    return (
        <div className="space-y-6 fade-in">
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <Card title={<span><Icon icon="pen-new-square-linear" className="text-blue-600 mr-2"/>Input Data Mahasiswa</span>}>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">Nama</label>
                                <input type="text" value={form.nama} onChange={e=>setForm({...form,nama:e.target.value})} required placeholder="Nama lengkap"
                                    className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-100"/></div>
                            <div><label className="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">NIM</label>
                                <input type="text" value={form.nim} onChange={e=>setForm({...form,nim:e.target.value})} required placeholder="NIM"
                                    className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-100"/></div>
                        </div>
                        <hr className="border-slate-200"/>
                        <p className="text-sm font-medium text-slate-700">Gejala (0 = Tidak, 1 = Ya)</p>
                        <div className="space-y-3">
                            {[
                                {k:'P',l:'Kehadiran < 75%',c:'bg-blue-100 text-blue-700'},
                                {k:'Q',l:'Plagiarisme',c:'bg-red-100 text-red-700'},
                                {k:'R',l:'Menyontek',c:'bg-red-100 text-red-700'},
                                {k:'S',l:'Tugas Tepat Waktu',c:'bg-green-100 text-green-700'}
                            ].map(d => (
                                <div key={d.k} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                                    <div className="flex items-center gap-3"><span className={`w-8 h-8 rounded-lg ${d.c} flex items-center justify-center font-bold text-sm`}>{d.k}</span><span className="text-sm text-slate-700">{d.l}</span></div>
                                    {sel(d.k.toLowerCase(), form[d.k])}
                                </div>
                            ))}
                        </div>
                        {error && <div className="p-3 rounded-xl bg-red-50 text-red-600 text-sm border border-red-100"><Icon icon="danger-circle-linear"/>{error}</div>}
                        <button type="submit" disabled={loading}
                            className="w-full py-2.5 bg-primary-900 text-white rounded-lg font-medium hover:bg-primary-800 transition-all shadow-sm hover:shadow-md flex items-center justify-center gap-2">
                            {loading ? <Icon icon="spinner-linear" className="animate-spin"/> : <Icon icon="magnifer-linear"/>}
                            {loading ? 'Memproses...' : 'DETEKSI PELANGGARAN'}
                        </button>
                    </form>
                </Card>

                <div className="space-y-6">
                    {!result ? (
                        <Card className="p-10 text-center text-slate-400">
                            <Icon icon="document-text-linear" size="4em" className="mb-4 text-slate-300 block mx-auto"/>
                            <p className="text-lg font-medium text-slate-500 mb-1">Belum ada deteksi</p>
                            <p className="text-sm">Silakan isi form dan tekan tombol deteksi.</p>
                        </Card>
                    ) : (
                        <>
                            <Card>
                                <div className="text-center">
                                    <span className={`inline-flex items-center px-4 py-2 rounded-full text-sm font-bold border ${statusBadge()[0]}`}>
                                        <Icon icon={statusBadge()[1]} className="mr-2"/>{result.status_label}
                                    </span>
                                    <p className="mt-2 text-sm text-slate-500">{result.nama} — {result.nim}</p>
                                </div>
                            </Card>
                            <Card title="Visualisasi Logika">
                                <h4 className="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">Input Fakta</h4>
                                <table className="w-full text-sm border border-slate-200 rounded-lg overflow-hidden mb-4">
                                    <thead><tr className="bg-slate-50 text-slate-500 font-medium"><th className="px-4 py-2 border-r">Kode</th><th className="px-4 py-2 border-r">Proposisi</th><th className="px-4 py-2">Nilai</th></tr></thead>
                                    <tbody className="divide-y divide-slate-100 text-center">
                                        {[{k:'P',v:'Kehadiran < 75%',val:form.P},{k:'Q',v:'Plagiarisme',val:form.Q},{k:'R',v:'Menyontek',val:form.R},{k:'S',v:'Tugas Tepat Waktu',val:form.S}].map(d=>(
                                            <tr key={d.k}><td className="px-4 py-2 font-bold border-r">{d.k}</td><td className="px-4 py-2 border-r text-left">{d.v}</td><td className={`px-4 py-2 font-bold ${d.val?'text-green-600':'text-red-600'}`}>{d.val?'TRUE':'FALSE'}</td></tr>
                                        ))}
                                    </tbody>
                                </table>
                                <h4 className="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">Evaluasi Rule</h4>
                                <table className="w-full text-sm border border-slate-200 rounded-lg overflow-hidden">
                                    <thead><tr className="bg-slate-50 text-slate-500 font-medium"><th className="px-4 py-2 border-r">Rule</th><th className="px-4 py-2 border-r">Ekspresi</th><th className="px-4 py-2">Hasil</th></tr></thead>
                                    <tbody className="divide-y divide-slate-100 text-center">
                                        {[
                                            {r:'R1',e:'Q → Berat',v:!!form.Q},
                                            {r:'R2',e:'R → Berat',v:!!form.R},
                                            {r:'R3',e:'(P∧¬S) → Peringatan',v:!!(form.P && !form.S)},
                                            {r:'R4',e:'¬semua → Aman',v:result.status_aman}
                                        ].map(d=>(
                                            <tr key={d.r}><td className="px-4 py-2 font-medium border-r">{d.r}</td><td className="px-4 py-2 border-r font-mono">{d.e}</td>
                                                <td className="px-4 py-2"><span className={`px-2 py-0.5 rounded text-xs font-bold ${d.v?'bg-green-100 text-green-700':'bg-slate-100 text-slate-500'}`}>{d.v?'TERPENUHI':'TIDAK'}</span></td></tr>
                                        ))}
                                    </tbody>
                                </table>
                            </Card>
                            <Card title={<span><Icon icon="code-linear" className="text-blue-600 mr-2"/>Reasoning Path (Forward Chaining)</span>}>
                                <div className="space-y-1 font-mono text-sm">
                                    {(result.reasoning_path||[]).map((step,i) => {
                                        let cls = 'text-slate-600';
                                        if (step.startsWith('===')) cls = 'font-bold text-slate-700 bg-slate-50 px-3 py-1.5 rounded-lg -mx-3 mt-2 mb-1';
                                        else if (step.startsWith('Rule')) cls = 'text-blue-700 font-medium';
                                        else if (step.includes('TERPENUHI')) cls = 'text-green-700 ml-4';
                                        else if (step.includes('tidak')) cls = 'text-slate-500 ml-4';
                                        return <p key={i} className={cls}>{step}</p>;
                                    })}
                                </div>
                            </Card>
                            <Card title={<span><Icon icon="document-text-linear" className="text-blue-600 mr-2"/>Output — Hasil Deteksi</span>}>
                                <div className="space-y-3">
                                    <p className="text-sm"><strong>Mahasiswa:</strong> {result.nama} ({result.nim})</p>
                                    <table className="w-full text-sm border border-slate-200 rounded-lg overflow-hidden">
                                        <thead><tr className="bg-slate-50 text-slate-500 font-medium"><th className="px-4 py-2">Input</th><th className="px-4 py-2">P</th><th className="px-4 py-2">Q</th><th className="px-4 py-2">R</th><th className="px-4 py-2">S</th></tr></thead>
                                        <tbody className="divide-y divide-slate-100 text-center"><tr><td className="px-4 py-2 font-medium">Nilai</td><td className="px-4 py-2">{form.P?'Ya':'Tidak'}</td><td className="px-4 py-2">{form.Q?'Ya':'Tidak'}</td><td className="px-4 py-2">{form.R?'Ya':'Tidak'}</td><td className="px-4 py-2">{form.S?'Ya':'Tidak'}</td></tr></tbody>
                                    </table>
                                    <div className="mt-3">
                                        <p className="text-sm font-medium mb-1">Rule Terpenuhi:</p>
                                        {(result.rule_terpenuhi||[]).length === 0 ? <p className="text-sm text-slate-500 italic">(tidak ada)</p> : (result.rule_terpenuhi||[]).map((r,i) => (
                                            <div key={i} className="flex items-center gap-2 text-sm"><Icon icon="check-circle-linear" className="text-green-500"/><span>{r}</span></div>
                                        ))}
                                    </div>
                                    <div className={`mt-3 p-4 rounded-xl font-bold text-center text-lg ${resultBgColor(result)}`}>
                                        {result.status_label}
                                    </div>
                                </div>
                            </Card>
                        </>
                    )}
                </div>
            </div>
        </div>
    );
};

// ==========================================
// TEST CASES PAGE
// ==========================================
const TestCases = () => {
    const [data, setData] = React.useState(null);
    React.useEffect(() => { api.get('test_cases.php').then(setData); }, []);
    if (!data) return <div className="text-center py-20 text-slate-400"><Icon icon="spinner-linear" className="animate-spin inline-block" size="2em"/></div>;
    return (
        <div className="space-y-6 fade-in">
            <Card title={<span><Icon icon="clipboard-check-linear" className="text-blue-600 mr-2"/>24 Skenario Pengujian</span>}>
                <div className="overflow-x-auto">
                    <table className="w-full text-sm border border-slate-200 rounded-xl overflow-hidden">
                        <thead><tr className="bg-slate-50 text-slate-500 font-medium"><th className="px-4 py-3 text-left">Skenario</th><th className="px-4 py-3 text-center">P</th><th className="px-4 py-3 text-center">Q</th><th className="px-4 py-3 text-center">R</th><th className="px-4 py-3 text-center">S</th><th className="px-4 py-3 text-left">Status</th></tr></thead>
                        <tbody className="divide-y divide-slate-100">
                            {data.map((t,i) => {
                                const c = testStatusColor(t);
                                return (
                                    <tr key={i} className="hover:bg-slate-50/80 transition-colors">
                                        <td className="px-4 py-3 font-medium text-slate-900 whitespace-nowrap">{t.label}</td>
                                        <td className="px-4 py-3 text-center font-bold">{t.P ? <span className="text-green-600">T</span> : <span className="text-red-600">F</span>}</td>
                                        <td className="px-4 py-3 text-center font-bold">{t.Q ? <span className="text-green-600">T</span> : <span className="text-red-600">F</span>}</td>
                                        <td className="px-4 py-3 text-center font-bold">{t.R ? <span className="text-green-600">T</span> : <span className="text-red-600">F</span>}</td>
                                        <td className="px-4 py-3 text-center font-bold">{t.S ? <span className="text-green-600">T</span> : <span className="text-red-600">F</span>}</td>
                                        <td className="px-4 py-3"><span className={`inline-flex px-2.5 py-0.5 rounded-full text-xs font-medium border ${c}`}>{t.status}</span></td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
                <div className="mt-4 p-4 bg-slate-50 rounded-xl">
                    <h4 className="text-sm font-semibold text-slate-700 mb-2">Keterangan:</h4>
                    <ul className="text-xs text-slate-500 space-y-1 list-disc list-inside">
                        <li><strong>Status Aman (3):</strong> Tidak ada rule 1,2,3 terpenuhi</li>
                        <li><strong>Peringatan Akademik (1):</strong> Hanya Rule 3 (P ∧ ¬S)</li>
                        <li><strong>Pelanggaran Berat via Q (4):</strong> Rule 1 (Q)</li>
                        <li><strong>Pelanggaran Berat via R (4):</strong> Rule 2 (R)</li>
                        <li><strong>Pelanggaran Berat via Q+R (4):</strong> Rule 1 dan 2</li>
                        <li><strong>Edge Cases (8):</strong> Kasus batas untuk verifikasi</li>
                    </ul>
                </div>
            </Card>
        </div>
    );
};

// ==========================================
// RIWAYAT PAGE
// ==========================================
const Riwayat = ({ user }) => {
    const [data, setData] = React.useState([]);
    const [detail, setDetail] = React.useState(null);
    const [modal, setModal] = React.useState(false);
    React.useEffect(() => { load(); }, []);
    const load = async () => {
        const res = await api.get(`deteksi.php?user_id=${user.id}&role=${user.role}`);
        if (Array.isArray(res)) setData(res);
    };
    const showDetail = async (id) => {
        const d = await api.get(`deteksi.php?id=${id}`);
        if (d.details) { setDetail(d); setModal(true); }
    };
    const badgeColor = (r) => {
        if (r.pelanggaran_berat) return r.peringatan_akademik ? 'red' : 'red';
        if (r.peringatan_akademik) return 'amber';
        return 'green';
    };
    return (
        <div className="space-y-6 fade-in">
            <Card title={<span><Icon icon="clock-circle-linear" className="text-blue-600 mr-2"/>Riwayat Deteksi</span>}>
                {data.length === 0 ? (
                    <div className="text-center py-16 text-slate-400"><Icon icon="clock-circle-linear" size="4em" className="mb-4 text-slate-300 block mx-auto"/><p className="text-lg font-medium text-slate-500">Belum ada riwayat</p></div>
                ) : (
                    <div className="overflow-x-auto">
                        <table className="w-full text-sm border border-slate-200 rounded-xl overflow-hidden">
                            <thead><tr className="bg-slate-50 text-slate-500 font-medium"><th className="px-4 py-3 text-left">Tanggal</th><th className="px-4 py-3 text-left">Mahasiswa</th><th className="px-4 py-3 text-left">NIM</th><th className="px-4 py-3 text-center">P</th><th className="px-4 py-3 text-center">Q</th><th className="px-4 py-3 text-center">R</th><th className="px-4 py-3 text-center">S</th><th className="px-4 py-3 text-left">Status</th><th className="px-4 py-3 text-center">Detail</th></tr></thead>
                            <tbody className="divide-y divide-slate-100">
                                {data.map(r => (
                                    <tr key={r.id} className="hover:bg-slate-50/80 transition-colors">
                                        <td className="px-4 py-3 text-slate-500 whitespace-nowrap">{(r.created_at||'').substring(0,16).replace('T',' ')}</td>
                                        <td className="px-4 py-3 font-medium text-slate-900">{r.nama_mahasiswa}</td>
                                        <td className="px-4 py-3 text-slate-500">{r.nim}</td>
                                        {['P','Q','R','S'].map(k => <td key={k} className={`px-4 py-3 text-center font-bold ${r[k]?'text-green-600':'text-red-600'}`}>{r[k]?1:0}</td>)}
                                        <td className="px-4 py-3"><Badge color={badgeColor(r)}>{r.status_label}</Badge></td>
                                        <td className="px-4 py-3 text-center"><button onClick={()=>showDetail(r.id)} className="text-blue-600 hover:text-blue-800 text-xs font-medium">Lihat</button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                )}
            </Card>
            <Modal isOpen={modal} onClose={()=>setModal(false)} title="Detail Reasoning Path">
                {detail && <div className="space-y-1 font-mono text-sm max-h-80 overflow-y-auto">
                    {(detail.details||[]).map(d => {
                        let cls = 'text-slate-600';
                        if (d.keterangan.startsWith('===')) cls = 'font-bold text-slate-700 bg-slate-50 px-3 py-1.5 rounded-lg -mx-3 mt-2 mb-1 block';
                        else if (d.keterangan.startsWith('Rule')) cls = 'text-blue-700 font-medium';
                        else if (d.keterangan.includes('TERPENUHI')) cls = 'text-green-700 ml-4';
                        else if (d.keterangan.includes('tidak')) cls = 'text-slate-500 ml-4';
                        return <p key={d.id} className={cls}>{d.keterangan}</p>;
                    })}
                </div>}
            </Modal>
        </div>
    );
};

// ==========================================
// ADMIN MAHASISWA PAGE
// ==========================================
const AdminMahasiswa = () => {
    const [data, setData] = React.useState([]);
    const [modal, setModal] = React.useState(false);
    const [edit, setEdit] = React.useState({id:0, nim:'', nama:''});
    const [toast, setToast] = React.useState(null);
    React.useEffect(() => { load(); }, []);
    const load = async () => { const r = await api.get('mahasiswa.php'); if (Array.isArray(r)) setData(r); };
    const save = async (e) => {
        e.preventDefault();
        const r = await api.post('mahasiswa.php', edit);
        if (r.success) { setToast({msg:r.message,type:'success'}); setModal(false); load(); }
        else setToast({msg:r.error||'Gagal',type:'error'});
    };
    const del = async (id) => {
        if (!confirm('Hapus mahasiswa ini?')) return;
        const r = await api.post('mahasiswa.php', {action:'delete',id});
        if (r.success) { setToast({msg:r.message,type:'success'}); load(); }
    };
    return (
        <div className="space-y-6 fade-in">
            {toast && <Toast {...toast} onClose={()=>setToast(null)}/>}
            <Card title={<span><Icon icon="users-group-rounded-linear" className="text-blue-600 mr-2"/>Kelola Mahasiswa</span>}
                action={<button onClick={()=>{setEdit({id:0,nim:'',nama:''});setModal(true);}} className="px-4 py-2 bg-primary-900 text-white rounded-lg text-sm font-medium hover:bg-primary-800 transition-all flex items-center gap-2"><Icon icon="add-circle-linear"/>Tambah</button>}>
                <div className="overflow-x-auto">
                    <table className="w-full text-sm border border-slate-200 rounded-xl overflow-hidden">
                        <thead><tr className="bg-slate-50 text-slate-500 font-medium"><th className="px-4 py-3 text-left">NIM</th><th className="px-4 py-3 text-left">Nama</th><th className="px-4 py-3 text-center">Total Deteksi</th><th className="px-4 py-3 text-center">Aksi</th></tr></thead>
                        <tbody className="divide-y divide-slate-100">
                            {data.map(m => (
                                <tr key={m.id} className="hover:bg-slate-50/80 transition-colors">
                                    <td className="px-4 py-3 font-mono text-slate-500">{m.nim}</td>
                                    <td className="px-4 py-3 font-medium text-slate-900">{m.nama}</td>
                                    <td className="px-4 py-3 text-center text-slate-500">{m.total_deteksi}</td>
                                    <td className="px-4 py-3 text-center">
                                        <button onClick={()=>{setEdit({id:m.id,nim:m.nim,nama:m.nama});setModal(true);}} className="text-blue-600 hover:text-blue-800 text-xs font-medium mx-1">Edit</button>
                                        <button onClick={()=>del(m.id)} className="text-red-600 hover:text-red-800 text-xs font-medium mx-1">Hapus</button>
                                    </td>
                                </tr>
                            ))}
                            {data.length===0 && <tr><td colSpan={4} className="px-4 py-8 text-center text-slate-400">Belum ada data</td></tr>}
                        </tbody>
                    </table>
                </div>
            </Card>
            <Modal isOpen={modal} onClose={()=>setModal(false)} title={edit.id?'Edit Mahasiswa':'Tambah Mahasiswa'}>
                <form onSubmit={save} className="space-y-4">
                    <div><label className="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">NIM</label>
                        <input type="text" value={edit.nim} onChange={e=>setEdit({...edit,nim:e.target.value})} required
                            className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-100"/></div>
                    <div><label className="block text-xs font-medium text-slate-500 mb-1.5 uppercase tracking-wide">Nama</label>
                        <input type="text" value={edit.nama} onChange={e=>setEdit({...edit,nama:e.target.value})} required
                            className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-100"/></div>
                    <div className="flex justify-end gap-2 pt-2">
                        <button type="button" onClick={()=>setModal(false)} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Batal</button>
                        <button type="submit" className="px-4 py-2 bg-primary-900 text-white rounded-lg text-sm font-medium hover:bg-primary-800">Simpan</button>
                    </div>
                </form>
            </Modal>
        </div>
    );
};

// ==========================================
// MAIN APP
// ==========================================
const App = () => {
    const [user, setUser] = React.useState(null);
    const [view, setView] = React.useState('dashboard');

    // Session storage
    React.useEffect(() => {
        const saved = sessionStorage.getItem('pa_user');
        if (saved) setUser(JSON.parse(saved));
    }, []);

    const handleLogin = (u) => {
        setUser(u);
        sessionStorage.setItem('pa_user', JSON.stringify(u));
    };

    const handleLogout = () => {
        setUser(null);
        sessionStorage.removeItem('pa_user');
    };

    if (!user) return <Login onLogin={handleLogin} />;

    const pages = {
        dashboard: <Dashboard user={user} />,
        rules: <Rules />,
        truth: <TruthTable />,
        input: <InputDeteksi user={user} />,
        test: <TestCases />,
        riwayat: <Riwayat user={user} />,
        admin_mhs: user.role === 'admin' ? <AdminMahasiswa /> : <div className="text-center py-20 text-slate-400">Akses ditolak</div>
    };

    return (
        <Layout user={user} view={view} setView={setView} onLogout={handleLogout}>
            {pages[view] || pages.dashboard}
        </Layout>
    );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
